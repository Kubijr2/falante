name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    # Catches Dockerfile breakage (bad COPY paths, missing deps, etc.)
    # before it's discovered at deploy time. Build-only — no push, no
    # registry credentials needed, since this is purely a "does it build"
    # check, not part of the deploy flow itself.
    steps:
      - uses: actions/checkout@v4
      - name: Build backend production image
        run: docker build -f backend/Dockerfile -t falante-backend:ci backend
