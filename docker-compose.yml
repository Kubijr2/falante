services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    # The whole backend/ folder is bind-mounted, so edits on your host are
    # picked up instantly by uvicorn's --reload — no rebuild needed for code
    # changes. Python dependencies are installed into the image's own
    # system site-packages (not into /app), so the bind mount can't shadow
    # them — no extra volume trickery needed here, unlike the frontend
    # below. It also means backend/falante.db (SQLite) is a real file on
    # your host machine, so it persists across `docker compose down`/`up`
    # automatically, without needing a separate named volume.
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    # Same bind-mount-for-hot-reload idea as the backend, but node_modules
    # DOES need shadowing here: npm installs native/platform-specific
    # binaries into node_modules, and the container is Linux — if your host
    # is macOS/Windows, its node_modules can't just run inside the
    # container. The named volume below sits at a more specific path than
    # the bind mount, so Compose lets it take precedence and the
    # container's own Linux-built node_modules survives untouched.
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - DOCKER=true
    depends_on:
      - backend

volumes:
  frontend_node_modules:
